# Account
account:
  created_date: "2016-01-01" # Date the Pinterest account was created (for warming schedule)

# Browser
browser:
  mode: gui # gui | headless
  session_file: "data/pinterest_session.json" # Playwright session (auto-managed)
  chrome_profile_path: "" # Optional: Path to custom Chrome profile (leave empty to use .env credentials)

# Niche Configuration
niche:
  seed_keywords:
    - "Islamic Reminders"
    - "Dhikr and Dua"
    - "Tawheed Allah"
    - "Istighfar Benefits"
    - "Morning Azkar"
    - "Night Azkar"
  categories:
    - "Islam"
    - "Islamic Reminders"

# Posting Schedule
schedule:
  start_hour: 8 # Hour to run daily cycle (24h format)
  timezone: "US/Eastern"
  peak_hours: [10, 14, 18, 20] # Hours in 24h format
  interval_min_minutes: 15 # Minimum gap between posts
  interval_max_minutes: 45 # Maximum gap between posts

# Scraper Behavior
scraper:
  mode: "safe" # safe = one browser window, sequential searches | fast = parallel browser windows
  safe_delay_seconds: 2

# Posting Destination Link
posting:
  schedule_mode: "scheduled" # scheduled | immediate
  destination_link_mode: "both" # none | description_only | destination_link | both
  default_destination_link: "https://www.youtube.com/@amerelshamy2406" # e.g. https://yoursite.com

# AI Configuration

ai:
  text_provider: "deepseek" # deepseek | groq | openai | openrouter
  text_model: "deepseek-v4-flash" # DeepSeek V4 Flash for metadata + quality gate
  quality_gate_model: "deepseek-v4-flash"
  self_healing_model: "deepseek-v4-pro"
  image_provider: "openai" # pollinations | openai | openai_images | together | huggingface | comfyui
  openai_image_model: "gpt-image-1" # Requires OPENAI_API_KEY
  openai_image_size: "1024x1536" # Pinterest-friendly 2:3 vertical image
  openai_image_quality: "medium" # low | medium | high
  max_images_per_day: 15 # Hard cap on image generation calls
  max_retries: 2 # Max regeneration attempts per pin

# Safety & Anti-Detection
safety:
  proxy_rotation_hours: 3 # Rotate proxy every N hours
  cooldown_hours: 48 # Cooldown duration after shadowban
  enable_shadowban_check: true # Check pin visibility 24h after posting

# Content Strategy
strategy:
  seo_percent: 70 # % of daily pins from SEO keywords
  trend_percent: 30 # % of daily pins from trending topics
  trend_boost_threshold: 2.0 # If trend velocity > this, boost trends to 50%

# Local Image Generation (ComfyUI)
comfyui:
  enabled: false
  host: "127.0.0.1"
  port: 8188
  model: "sd_xl_base_1.0.safetensors"
  install_path: "" # Optional: Path to ComfyUI installation if enabled

# Cost Limits
limits:
  max_api_cost_per_day: 0.00 # OpenAI image generation is paid; cost enforcement is not enabled yet

# Paths (relative to project root)
paths:
  assets_dir: "assets"
  database: "data/pga.db"
